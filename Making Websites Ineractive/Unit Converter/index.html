<!DOCTYPE html>
    <html>
        <head>
            <link rel="stylesheet" href="index.css">
        </head>
        <body>
            <div class="design">
                <div class="header-top">
                    <h1 class="title">Metric/Imperial Unit Conversion</h1>
                    <input type="number" class="unit-value" id="current-value" value="0">
                    <button class="btn-convert" onclick="conversion()">Convert</button>
                </div>
                <div class="data-container">
                    <div class="length-conversion">
                        <h3>Length (Meter/Feet)</h3>
                        <h4 id="length-data">0 meters = 0 feet | 0 feet = 0 meters</h4>
                    </div>
                    <div class="volume-conversion">
                        <h3>Volume (Liters/Gallons)</h3>
                        <h4 id="volume-data">0 liters = 0 gallons | 0 gallons = 0 liters</h4> 
                    </div>
                    <div class="mass-conversion">
                        <h3>Volume (Kilograms/Pounds)</h3>
                        <h4 id="mass-data">0 kilos = 0 pounds | 0 pounds = 0 kilos</h4> 
                    </div>
                </div>
            </div>
            <script src="index.js"></script>
        </body>
    </html>

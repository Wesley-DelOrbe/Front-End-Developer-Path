<html>
    <head>
        <link rel="stylesheet" href="index.css">
        
    </head>
    <body>
        <div class="container">
            <div class="scores-wrapper">
                <div>
                    <h3>HOME</h3>
                    <h4 class="scoreBoard" id="home-scoreboard">0</h4>
                    <div class="Points-inc">
                        <button onclick="increment1H()">+1</button>
                        <button onclick="increment2H()">+2</button>
                        <button onclick="increment3H()">+3</button>
                        </div>
                </div>
                <div>
                    <h3>GUEST</h3>
                    <h4 class="scoreBoard" id="guest-scoreboard">0</h4>
                    <div class="Points-inc">
                        <button onclick="increment1G()">+1</button>
                        <button onclick="increment2G()">+2</button>
                        <button onclick="increment3G()">+3</button>
                    </div>   
                </div>
            </div>    
            <div>
             <button class="new-game-btn" onclick="newGame()">New Game</button>   
            </div> 
        </div>
        <script src="index.js"></script>
    </body>
</html>
